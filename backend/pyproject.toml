[project]
name = "ai-data-analyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

