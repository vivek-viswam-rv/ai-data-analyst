[project]
name = "ai-data-analyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic-settings>=2.7.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
